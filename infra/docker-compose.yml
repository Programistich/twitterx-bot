name: twitterx-bot

services:
  twitterx-bot:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: twitterx-bot
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - twitterx-bot-net
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: twitterx-bot-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-twitterx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-twitterx}
      POSTGRES_DB: ${POSTGRES_DB:-twitterx}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - twitterx-bot-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-twitterx} -d ${POSTGRES_DB:-twitterx}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  twitterx-bot-net:
    name: twitterx-bot_shared_network
